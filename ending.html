<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>Happy New Year</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100svh;
            font-family: 'Mali', cursive;
            background: linear-gradient(135deg,
                    #FFAFCC,
                    #BDE0FE,
                    #CDB4F5,
                    #FFC8DD);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #5a3a6e;
            overflow: hidden;
        }

        /* ===== Phone Shell ===== */
        .phone-shell {
            width: 380px;
            height: 700px;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
        }

        /* ===== Phone Layout ===== */
        .phone {
            width: 100%;
            height: 100%;
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
        }

        /* ===== Header (TOP) ===== */
        .header {
            text-align: center;
            padding-bottom: 12px;
            flex-shrink: 0;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .header p {
            font-size: 13px;
            opacity: 0.75;
            margin-top: 4px;
        }

        /* ===== Content (SCROLL AREA) ===== */
        .content {
            flex: 1;
            min-height: 0;
            /* ⭐ สำคัญมาก */
            display: flex;
        }

        .typing-box {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 22px;
            padding: 20px 18px;
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 24px rgba(255, 175, 204, 0.35);
        }

        /* caret */
        .typing-box::after {
            content: "";
            width: 6px;
            height: 18px;
            background: #FFAFCC;
            position: absolute;
            right: 16px;
            bottom: 16px;
            border-radius: 999px;
            animation: caret 0.9s infinite;
        }

        @keyframes caret {

            0%,
            50% {
                opacity: 1;
            }

            50.01%,
            100% {
                opacity: 0;
            }
        }

        /* ===== Scrollbar ===== */
        .typing-box::-webkit-scrollbar {
            width: 6px;
        }

        .typing-box::-webkit-scrollbar-thumb {
            background: rgba(255, 175, 204, 0.55);
            border-radius: 999px;
        }

        .typing-box {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 175, 204, 0.55) transparent;
        }

        /* ===== Footer (BOTTOM) ===== */
        .footer {
            padding-top: 14px;
            flex-shrink: 0;
        }

        .next-btn {
            display: block;
            width: 100%;
            padding: 13px 0;
            border-radius: 999px;
            text-align: center;
            text-decoration: none;
            font-family: 'Mali', cursive;
            font-size: 14px;
            font-weight: 600;
            color: #5a3a6e;
            background: linear-gradient(135deg,
                    #FFAFCC,
                    #FFC8DD,
                    #BDE0FE);
            opacity: 0.5;
            pointer-events: none;
            transition: 0.3s;
        }

        .next-btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .next-btn:hover {
            transform: translateY(-2px);
        }

        /* ===== Responsive ===== */
        @media (max-width: 430px) {
            .phone-shell {
                width: calc(100vw - 32px);
                height: auto;
                aspect-ratio: 380 / 700;
            }
        }

        @media (max-width: 360px) {
            .typing-box {
                font-size: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        @supports (padding: env(safe-area-inset-left)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }
    </style>
</head>

<body>

    <div class="phone-shell">
        <div class="phone">

            <!-- TOP -->
            <div class="header">
                <h2>ข้อความปิดท้ายปีนี้</h2>
                <p>จากใจเค้าถึงเธอ</p>
            </div>

            <!-- SCROLLABLE CONTENT -->
            <div class="content">
                <div class="typing-box" id="typing"></div>
            </div>

            <!-- BOTTOM -->
            <div class="footer">
                <a href="index.html" class="next-btn" id="backBtn">
                    กลับไปหน้าแรก
                </a>
            </div>

        </div>
    </div>

    <script>
        const text = `ปีที่แล้วอาจไม่ง่ายเสมอไป  
มีทั้งวันที่ดี  
และวันที่เหนื่อยกว่าที่คิด  

แต่ทุกช่วงเวลาที่ผ่านมา  
สิ่งหนึ่งที่ชัดเจนสำหรับเค้ามาก  
คือการมีเธออยู่ตรงนั้น  

ขอบคุณสำหรับปีที่แล้ว  
ขอบคุณที่ยังอยู่  
และยังเดินมาถึงตรงนี้ด้วยกัน  

จากนี้ไป…  
ขอให้ปีใหม่ค่อย ๆ ใจดีกับเรา  
และหวังว่าเราจะดูแลกันได้ดีขึ้นกว่าเดิม
`;

        const typingEl = document.getElementById("typing");
        const btn = document.getElementById("backBtn");
        let i = 0;

        function typeText() {
            if (i < text.length) {
                typingEl.textContent += text.charAt(i);
                typingEl.scrollTop = typingEl.scrollHeight; // auto-scroll
                i++;
                setTimeout(typeText, 40);
            } else {
                btn.classList.add("active");
            }
        }

        typeText();
    </script>

</body>

</html>
