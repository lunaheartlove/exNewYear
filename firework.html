<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>Happy New Year</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100svh;
            font-family: 'Mali', cursive;
            background: linear-gradient(135deg,
                    #FFAFCC,
                    #BDE0FE,
                    #CDB4F5,
                    #FFC8DD);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== Outer Shell (กัน Safari ทำขอบหาย) ===== */
        .phone-shell {
            width: 380px;
            height: 700px;
            border-radius: 36px;
            overflow: hidden;
            /* ⭐ ตัวสำคัญ */
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            transform: translateZ(0);
        }

        /* ===== Inner Phone ===== */
        .phone {
            width: 100%;
            height: 100%;
            background: #111;
            position: relative;
            transform: translateZ(0);
        }

        /* ===== Scene ===== */
        .scene {
            position: absolute;
            inset: 0;
            background: rgba(26, 26, 46, 0.9);
            z-index: 0;
        }

        /* ===== Night Overlay ===== */
        .night {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at bottom,
                    rgba(26, 26, 46, 0.85),
                    rgba(0, 0, 0, 0.95));
            opacity: 0;
            animation: fadeToNight 5s ease forwards;
            z-index: 1;
        }

        @keyframes fadeToNight {
            to {
                opacity: 0.7;
            }
        }

        /* ===== Firework Particle ===== */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: particleMove 1.6s ease-out forwards;
            box-shadow:
                0 0 10px currentColor,
                0 0 26px currentColor;
            mix-blend-mode: screen;
            z-index: 3;
            will-change: transform, opacity;
        }

        @keyframes particleMove {
            to {
                transform: translate(var(--x), var(--y)) scale(0.2);
                opacity: 0;
            }
        }

        /* ==================================================
           RESPONSIVE
        ================================================== */

        /* ≤ 360px */
        @media (max-width: 360px) {
            .phone-shell {
                transform: scale(0.88);
            }
        }

        /* 361px – 480px (iPhone X – 16 Pro) */
        @media (min-width: 361px) and (max-width: 480px) {
            .phone-shell {
                transform: scale(0.95);
            }
        }

        /* Fix iOS ขอบซ้ายขวา */
        @media (max-width: 430px) {
            .phone-shell {
                max-width: calc(100vw - 24px);
            }
        }

        /* 481px – 599px */
        @media (min-width: 481px) and (max-width: 599px) {
            .phone-shell {
                transform: scale(1);
            }
        }

        /* 600px – 1024px (Tablet) */
        @media (min-width: 600px) and (max-width: 1024px) {
            body {
                padding: 32px;
            }

            .phone-shell {
                transform: scale(1.08);
            }
        }

        /* Landscape มือถือ */
        @media (orientation: landscape) and (max-height: 420px) {
            body {
                align-items: flex-start;
                padding-top: 12px;
            }

            .phone-shell {
                transform: scale(0.82);
            }
        }

        /* Reduce motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        /* Safe area (iOS notch) */
        @supports (padding: env(safe-area-inset-left)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }
    </style>
</head>

<body>

    <div class="phone-shell">
        <div class="phone" id="phone">
            <div class="scene"></div>
            <div class="night"></div>
        </div>
    </div>

    <script>
        const colors = [
            "#ff4fd8",
            "#ffe84a",
            "#4dfff3",
            "#9b5cff",
            "#ff9f1c",
            "#7cff6b",
            "#ffffff"
        ];

        const phone = document.getElementById("phone");

        const MAX_FIREWORKS = 16;
        const FIREWORK_INTERVAL = 650;
        const PARTICLE_LIFE = 1600;

        let fired = 0;

        setTimeout(startFireworks, 2200);

        function startFireworks() {
            const interval = setInterval(() => {
                if (fired >= MAX_FIREWORKS) {
                    clearInterval(interval);

                    // 🔁 กลับหน้า index
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, PARTICLE_LIFE + 600);

                    return;
                }

                launchFirework();
                fired++;
            }, FIREWORK_INTERVAL);
        }

        function launchFirework() {
            const rect = phone.getBoundingClientRect();
            const x = Math.random() * rect.width;
            const y = Math.random() * rect.height * 0.6 + rect.height * 0.15;
            explode(x, y);
        }

        function explode(x, y) {
            const baseColor = colors[Math.floor(Math.random() * colors.length)];
            createRing(x, y, 18, 90, baseColor);
            setTimeout(() => createRing(x, y, 12, 55, lightenColor(baseColor)), 120);
        }

        function createRing(x, y, count, radius, color) {
            for (let i = 0; i < count; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                p.style.background = color;

                const angle = (Math.PI * 2 / count) * i;
                const distance = Math.random() * radius * 0.6 + radius * 0.4;

                p.style.left = x + "px";
                p.style.top = y + "px";
                p.style.setProperty("--x", Math.cos(angle) * distance + "px");
                p.style.setProperty("--y", Math.sin(angle) * distance + "px");

                phone.appendChild(p);
                setTimeout(() => p.remove(), PARTICLE_LIFE);
            }
        }

        function lightenColor(color) {
            if (color === "#ffffff") return color;
            let num = parseInt(color.slice(1), 16);
            let r = Math.min(255, (num >> 16) + 40);
            let g = Math.min(255, ((num >> 8) & 255) + 40);
            let b = Math.min(255, (num & 255) + 40);
            return "#" + (r << 16 | g << 8 | b).toString(16).padStart(6, "0");
        }
    </script>

</body>

</html>
